{
  "folders": {},
  "connections": {
    "pg-bi-paros": {
      "provider": "postgresql",
      "driver": "postgres-jdbc",
      "name": "bi_paros (PostgreSQL DW)",
      "description": "Warehouse of the project. Host 'db' is the PostgreSQL service on the compose network. No password is stored: CloudBeaver asks for it on connect (POSTGRES_PASSWORD in .env).",
      "save-password": false,
      "read-only": false,
      "configuration": {
        "host": "db",
        "port": "5432",
        "database": "bi_paros",
        "url": "jdbc:postgresql://db:5432/bi_paros",
        "user": "bi_admin",
        "type": "dev",
        "auth-model": "native"
      }
    }
  }
}
